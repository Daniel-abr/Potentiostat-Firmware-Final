[env:esp32-s3-n32r16v-final]
; Using the pioarduino fork instead of the stock "espressif32" platform:
; the stock platform bundles an older Arduino-ESP32 core with known boot
; failures ("assert failed: do_core_init ... flash_ret == ESP_OK") on
; boards with in-package OCTAL SPI flash (like the N32R16V's 32MB octal
; flash), as opposed to the more common quad-SPI flash boards.
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_ldf_mode = deep
lib_compat_mode = strict

; Waveshare ESP32-S3-DEV-KIT-N32R16V-M = 32MB flash, 16MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1


lib_deps =
	mathieucarbou/ESPAsyncWebServer @ ^3.3.22
    mathieucarbou/AsyncTCP @ ^3.2.14
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit GFX Library @ ^1.12.6
    ricmoo/QRCode @ ^0.0.1